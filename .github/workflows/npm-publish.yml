name: Publish to npm

# 打 v*.*.* 标签时自动发布到 npm；也可以在 Actions 页手动触发（用于补发已有版本）。
# 免 token：使用 npm Trusted Publishing（OIDC），无需在仓库里配置 NPM_TOKEN。
# 一次性前置条件：在 npmjs.com → @atorber/hitrading → Settings → Trusted publishing
# 添加 GitHub Actions 发布者：
#   Organization or user: atorber
#   Repository:           dsh-hitrading
#   Workflow filename:    npm-publish.yml（只填文件名，不含路径）
#   Allowed actions:      勾选 "npm publish"（新配置默认只允许 npm stage publish，
#                         不勾选则本工作流的 npm publish 会被拒绝）
# 详见 docs/src/content/docs/release.mdx。
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC：npm Trusted Publishing 用短时凭证换发布令牌

jobs:
  publish:
    name: 发布 @atorber/hitrading 到 npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # 发布构建不使用依赖缓存

      - name: 版本一致性 / 清单校验
        run: |
          npm run check:version
          npm run check:manifest

      - name: 打包检查
        run: npm pack --dry-run

      - name: 检查版本是否已发布（幂等）
        id: published
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "name=$NAME version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION 已发布，本次跳过"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布（Trusted Publishing / OIDC，无需 token）
        if: steps.published.outputs.already != 'true'
        # npm CLI 自动检测 GitHub Actions 的 OIDC 环境换取短时发布凭证；
        # provenance 由 npm 自动生成，无需 --provenance 参数。
        run: npm publish --access public

      - name: 结果
        run: echo "::notice::发布流程完成：${{ steps.published.outputs.name }}@${{ steps.published.outputs.version }}（本次之前已发布=${{ steps.published.outputs.already }}）"
